name: Verify JARVIS lite Python syntax
on:
  push:
    branches: [main]
    paths:
      - 'src/jarvis/agent_team.py'
      - 'src/jarvis/app.py'
      - 'tests/test_dit_runtime.py'
      - 'tests/test_dit_lite_single_turn.py'
      - '.github/workflows/jarvis-lite-syntax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing JARVIS runtime and pinned agent SDK
        run: python -m pip install -e '.[intelligence,dev]'
      - name: Compile changed JARVIS source
        run: python -m py_compile src/jarvis/agent_team.py src/jarvis/app.py
      - name: Test DIT stream lifecycle and actual SDK construction
        run: python -m pytest tests/test_dit_runtime.py tests/test_dit_lite_single_turn.py -q
