[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-research-core"
version = "0.3.1"
description = "JARVIS clean research core — Step 3 evidence and specialist intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
research = [
  "polars>=1.44,<2",
  "river>=0.26,<1",
  "duckdb>=1.5,<2",
  "pyarrow>=25,<26",
  "optuna>=5,<6",
]
intelligence = [
  "networkx>=3.6,<4",
  "openai-agents==0.22.3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
jarvis-core = "jarvis.__main__:main"
jarvis-doctor = "jarvis.doctor:main"
jarvis-smoke = "jarvis.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
jarvis = ["web/*"]
