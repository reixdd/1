[package]
name = "mika-desktop"
version = "0.3.2"
description = "MIKA read-only research companion"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-ico", "image-png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
